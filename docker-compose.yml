# Production stack for Coolify (Docker Compose build pack).
# One Coolify resource builds and runs the whole stack from this file.
#
# Coolify setup:
#   Build Pack:        Docker Compose
#   Base Directory:    /
#   Compose Location:  /docker-compose.yml
#
# Domains (set per-service in Coolify's "Domains" field — the :port is the
# CONTAINER port Coolify routes to; the public URL is on port 80/443):
#   web          -> http://ui.celeboty.com:3000
#   api          -> http://api.celeboty.com:3001
#   temporal-ui  -> http://temporal.celeboty.com:8080
#
# Environment variables (set once in the resource's "Environment Variables";
# each ${VAR} below becomes an editable field there):
#   NEXT_PUBLIC_API_URL  -> public URL of the api (NO port)  e.g. http://api.celeboty.com
#   CORS_ORIGIN          -> public URL of the web (NO port)  e.g. http://ui.celeboty.com
#   OPENCODE_API_KEY     -> worker LLM key (required)
#   TAVILY_API_KEY       -> worker search key (required)
#   TEMPORAL_NAMESPACE / TEMPORAL_TASK_QUEUE -> optional (default below)
# Postgres credentials are auto-generated by Coolify
# (SERVICE_USER_POSTGRES, SERVICE_PASSWORD_64_POSTGRES) — do not set those.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: research_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES} -d research_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.25
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      TEMPORAL_ADDRESS: temporal:7233
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development.yaml
    depends_on:
      temporal-postgres:
        condition: service_healthy
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig

  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/research_agent?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:?}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-research-agent}
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/research_agent?schema=public
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-research-agent}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:?}
      TAVILY_API_KEY: ${TAVILY_API_KEY:?}
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
    depends_on:
      - api

volumes:
  postgres_data:
  temporal_postgres_data: