# Production stack for Coolify (Docker Compose build pack).
# One Coolify resource builds and runs the whole stack from this file.
#
# Coolify setup:
#   Build Pack:        Docker Compose
#   Base Directory:    /
#   Compose Location:  /docker-compose.yml
#
# Environment: set these once in the resource's "Environment Variables"
# (Coolify creates an editable entry for every ${VAR} below):
#   OPENCODE_API_KEY, TAVILY_API_KEY        -> worker (required)
#   NEXT_PUBLIC_API_URL, CORS_ORIGIN        -> optional, auto-default to generated URLs
#   TEMPORAL_NAMESPACE, TEMPORAL_TASK_QUEUE -> optional, default below
# Postgres credentials + public domains are auto-generated by Coolify
# (SERVICE_USER_POSTGRES, SERVICE_PASSWORD_64_POSTGRES, SERVICE_URL_*).

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: research_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES} -d research_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.25
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      TEMPORAL_ADDRESS: temporal:7233
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development.yaml
    depends_on:
      temporal-postgres:
        condition: service_healthy
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig

  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      SERVICE_URL_TEMPORAL_UI_8080: /
    depends_on:
      - temporal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_URL_API_3001: /
      PORT: 3001
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/research_agent?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-${SERVICE_URL_WEB_3000}}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-research-agent}
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/research_agent?schema=public
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-research-agent}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:?}
      TAVILY_API_KEY: ${TAVILY_API_KEY:?}
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${SERVICE_URL_API_3001}}
    restart: unless-stopped
    environment:
      SERVICE_URL_WEB_3000: /
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${SERVICE_URL_API_3001}}
    depends_on:
      - api

volumes:
  postgres_data:
  temporal_postgres_data: